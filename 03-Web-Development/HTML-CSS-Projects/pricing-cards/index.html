<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="PricingCards.css">

</head>

<body>

    <div class="cards">

        <div class="card">
            <h1 class="card-title">Basic</h1>
            <h3 class="card-price">₹199/month</h3>
            <p class="features">1 Website <br>Basic Support </p>
            <button class="btn">Buy Now</button>
        </div>

        <div class="card pro-card">
            <h1 class="card-title">Pro</h1>

            <h3 class="card-price">₹499/month</h3>
            <p class="features">5 Website <br>Priority Support</p>

            <button class="btn procard-btn">Buy Now</button>
        </div>

        <div class="card">
            <h1 class="card-title">Premium</h1>

            <h3 class="card-price">₹999/month</h3>
            <p class="features">Unlimited Websites <br>24/7 Support</p>

            <button class="btn">Buy Now</button>
        </div>

    </div>

</body>

</html>
